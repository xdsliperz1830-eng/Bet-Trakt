# Publishes the app to GitHub Pages on every push.
# Repo settings needed once:
#   Settings -> Pages -> Source: "GitHub Actions"
#   Settings -> Environments -> github-pages -> Deployment branches: allow this branch
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/loving-cori-hb1n3x, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html styles.css sw.js manifest.webmanifest js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Separate job so the uploaded site is fully registered before deploying.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
